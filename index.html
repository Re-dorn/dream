<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>云海步道</title>
<style>
  /* Layout: full-bleed live scene; one quiet control card floats over the sky, docks to the bottom on phones. */
  :root {
    --bg: #cfe3ec;            /* the scene's horizon haze, seen before the first frame */
    --card: rgba(247, 250, 251, 0.86);
    --ink: #1d2a33;
    --muted: #5a6c78;
    --line: rgba(29, 42, 51, 0.13);
    --well: rgba(29, 42, 51, 0.06);
    --accent: #3b78bf;        /* the blue of 白日藥房 / 汽水小賣部 signs */
    --on-accent: #ffffff;
    --font: "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Hiragino Sans", system-ui, sans-serif;
    --shadow: 0 6px 24px rgba(29, 42, 51, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a2731; --card: rgba(19, 27, 34, 0.84); --ink: #e7eef2; --muted: #9db0bd;
      --line: rgba(231, 238, 242, 0.14); --well: rgba(231, 238, 242, 0.07); --accent: #6aa6dc; --on-accent: #0e1820;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a2731; --card: rgba(19, 27, 34, 0.84); --ink: #e7eef2; --muted: #9db0bd;
    --line: rgba(231, 238, 242, 0.14); --well: rgba(231, 238, 242, 0.07); --accent: #6aa6dc; --on-accent: #0e1820;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
  [hidden] { display: none !important; }   /* own copy of the rule, so the page also works opened as a local file */
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .card {
    position: fixed;
    top: max(16px, calc(env(safe-area-inset-top, 0px) + 12px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: 17.5rem;
    display: grid; gap: 0.85rem;
    padding: 0.95rem 1rem 1rem;
    background: var(--card);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .card header { display: grid; gap: 0.15rem; }
  .card h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.08em; text-wrap: balance; }
  .card .sub { margin: 0; font-size: 0.78rem; color: var(--muted); }
  .group { display: grid; gap: 0.4rem; }
  .label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.12em; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--well); border-radius: 9px; }
  .seg button, .row button {
    font: inherit; font-size: 0.86rem; color: var(--ink); background: transparent;
    border: 0; border-radius: 7px; padding: 0.42rem 0.4rem; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--line); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .slider { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.6rem; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .slider output { font-variant-numeric: tabular-nums; font-size: 0.82rem; min-width: 2.6em; text-align: right; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem; }
  .row button { border: 1px solid var(--line); background: var(--well); }
  .row button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .hint { margin: 0; font-size: 0.72rem; line-height: 1.55; color: var(--muted); }
  kbd { font-family: inherit; font-size: 0.68rem; padding: 0 0.3em; border: 1px solid var(--line); border-radius: 4px; }

  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 0.95rem; letter-spacing: 0.1em; color: var(--muted); background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center; pointer-events: none; line-height: 1.7; white-space: pre-line;
  }
  #status.err { letter-spacing: 0; color: var(--ink); font-size: 0.9rem; pointer-events: auto; user-select: text; }

  #spdOut { min-width: 4.4em; }

  /* free roam on touch screens: a move stick bottom-left, climb / sink buttons bottom-right */
  .joy {
    position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: var(--joy-b, 24px);
    width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); touch-action: none; user-select: none;
  }
  .joy .knob { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); opacity: 0.85; pointer-events: none; }
  .lift { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: var(--joy-b, 24px); display: grid; gap: 12px; }
  .lift button {
    width: 54px; height: 54px; border-radius: 50%; font: inherit; font-size: 1.05rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); touch-action: none; user-select: none;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .lift button:active { background: var(--accent); color: var(--on-accent); }

  @media (max-width: 560px) {
    .card {
      top: auto; bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
      left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      width: auto; gap: 0.6rem; padding: 0.75rem;
    }
    .card .sub, .hint { display: none; }
    .card h1 { font-size: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="scene" aria-label="云海步道三维场景：云海旁的蓝砖步道和白色楼群"></canvas>

<section class="card" aria-label="画风与视角">
  <header>
    <h1>云海步道</h1>
    <p class="sub">镜头 1 · Blender 场景的实时网页版</p>
  </header>
  <div class="group">
    <span class="label" id="lbl-style">画风</span>
    <div class="seg" role="group" aria-labelledby="lbl-style">
      <button type="button" id="st-clean" data-style="clean" aria-pressed="false">原样</button>
      <button type="button" id="st-pixel" data-style="pixel" aria-pressed="true">像素</button>
      <button type="button" id="st-toon" data-style="toon" aria-pressed="false">三渲二</button>
    </div>
  </div>
  <div class="group" id="pixelRow">
    <label class="label" for="px">像素大小</label>
    <div class="slider">
      <input type="range" id="px" min="2" max="4" step="0.25" value="4">
      <output id="pxOut" for="px">4</output>
    </div>
  </div>
  <div class="group">
    <span class="label" id="lbl-view">视角</span>
    <div class="seg" role="group" aria-labelledby="lbl-view">
      <button type="button" id="vw-shot" data-view="shot" aria-pressed="true">镜头 1</button>
      <button type="button" id="vw-fly" data-view="fly" aria-pressed="false">自由漫游</button>
      <button type="button" id="vw-iso" data-view="iso" aria-pressed="false">等距俯视</button>
    </div>
  </div>
  <div class="group" id="flyRow" hidden>
    <label class="label" for="spd">移动速度</label>
    <div class="slider">
      <input type="range" id="spd" min="0" max="100" step="1" value="31">
      <output id="spdOut" for="spd">6 m/s</output>
    </div>
  </div>
  <div class="row">
    <button type="button" id="walk" aria-pressed="false">沿步道前进</button>
    <button type="button" id="reset">复位</button>
  </div>
  <div class="row">
    <button type="button" id="motion" aria-pressed="true">云在动</button>
  </div>
  <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右键平移<br><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 漫游 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 画风 · <kbd>V</kbd> 视角</p>
</section>

<div class="joy" id="joy" hidden aria-hidden="true"><div class="knob"></div></div>
<div class="lift" id="lift" hidden>
  <button type="button" data-lift="1" aria-label="上升">▲</button>
  <button type="button" data-lift="-1" aria-label="下降">▼</button>
</div>

<div id="status" role="status">正在启动…</div>

<script>
  // Boot watchdog: if anything stops the scene from starting, say what and where instead of spinning forever.
  (function () {
    var boot = window.__boot = { stage: '正在启动…', t0: Date.now() };
    function show(msg, isErr) {
      var s = document.getElementById('status');
      if (!s) return;
      s.hidden = false;
      s.textContent = msg;
      if (isErr) s.className = 'err';
    }
    window.__showStatus = show;
    window.addEventListener('error', function (e) {
      if (!window.__booted && e && e.message) show('出错了：' + e.message, true);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (!window.__booted) show('出错了：' + (r && r.message ? r.message : String(r)), true);
    });
    document.addEventListener('securitypolicyviolation', function (e) {
      if (!window.__booted) show('被页面的安全策略拦下：' + (e.blockedURI || '') + '（' + (e.violatedDirective || '') + '）', true);
    });
    setTimeout(function () {
      if (!window.__booted && !/^出错|^被页面|^three|^渲染|^场景|^这个浏览器/.test(document.getElementById('status').textContent)) {
        show(boot.stage + '\n已经等了 25 秒还没好。卡在"加载 3D 引擎"一般是网络连不上 cdnjs / unpkg / jsDelivr；卡在"渲染第一帧"一般是显卡加速没开。', true);
      }
    }, 25000);
  })();
</script>

// three.js is loaded with a plain dynamic import from whichever CDN answers first in this order;
// no import map and no add-ons, so nothing depends on how the page is embedded.
const THREE_URLS = [
  './three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js',
  'https://unpkg.com/three@0.170.0/build/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js',
];
const stage = (t) => { if (window.__boot) window.__boot.stage = t; const s = document.getElementById('status'); if (s && !window.__booted) s.textContent = t; };
const fail = (t) => { if (window.__showStatus) window.__showStatus(t, true); else console.error(t); };
async function loadThree() {
  const tried = [];
  for (const url of THREE_URLS) {
    try {
      return await Promise.race([import(url), new Promise((_, rej) => setTimeout(() => rej(new Error('超时')), 12000))]);
    } catch (e) {
      tried.push((url.startsWith('.') ? '本地' : new URL(url).host) + '（' + (e && e.message ? e.message : e) + '）');
    }
  }
  throw new Error('three.js 没有加载下来：' + tried.join('；'));
}

// ------------------------------------------------------------------ rng / noise
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.uni = (lo, hi) => lo + (hi - lo) * f();
  f.int = (lo, hi) => lo + Math.floor((hi - lo + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.wpick = (list) => {
    let s = 0;

      f: on('KeyW', 'ArrowUp') - on('KeyS', 'ArrowDown') - this.joy.y,
      s: on('KeyD', 'ArrowRight') - on('KeyA', 'ArrowLeft') + this.joy.x,
      u: on('KeyE', 'Space') - on('KeyQ') + this.lift,
      fast: on('ShiftLeft', 'ShiftRight') ? 4 : 1,
    };
  }
  update(dt) {   // returns true while the camera is moving
    const { f, s, u, fast } = this.input();
    const want = this._v.set(0, 0, 0);
    if (f || s || u) {   // forward / sideways stay level whatever the pitch (like walking); E / Q do the climbing
      this._f.set(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
      this._r.set(Math.cos(this.yaw), 0, -Math.sin(this.yaw));
      want.addScaledVector(this._f, f).addScaledVector(this._r, s);
      want.y += u;
      if (want.lengthSq() > 1) want.normalize();
      want.multiplyScalar(this.speed * fast);
    }
    this.vel.lerp(want, 1 - Math.exp(-dt * 8));   // ease in and out
    if (want.lengthSq() === 0 && this.vel.lengthSq() < 1e-4) { this.vel.set(0, 0, 0); return false; }
    const p = this.camera.position.addScaledVector(this.vel, dt);
    p.y = Math.max(-12, Math.min(2600, p.y));
    const rr = Math.hypot(p.x, p.z);
    if (rr > 9000) { p.x *= 9000 / rr; p.z *= 9000 / rr; }
    this.camera.updateMatrixWorld();
    return true;
  }
}

// ------------------------------------------------------------------ canvas textures
function tileCanvas(o) {
  const { S, tw, th, rowOff = 0, c1, c2, mortar, mPx = 1.5, px = 1024, wear = null, wearT = 0.7, wearF = 12, grime = 0, seed = 1, vary = 0.06 } = o;
  const cv = document.createElement('canvas');
  cv.width = cv.height = px;
  const g = cv.getContext('2d'), k = px / S, rng = RNG(seed);
  g.fillStyle = mortar; g.fillRect(0, 0, px, px);
  const A = hexRGB(c1), B = hexRGB(c2);
  const nx = Math.round(S / tw), ny = Math.round(S / th);
  for (let j = 0; j < ny; j++) {
    const off = (j & 1) ? rowOff * tw : 0;
    for (let i = 0; i < nx; i++) {
      const x0 = i * tw + off, y0 = j * th;
      let col = mixRGB(A, B, rng());
      let sh = 1 + (rng() - 0.5) * vary;
      if (grime) sh *= 1 - grime * fbmP((x0 / S) * 3, (y0 / S) * 3, 3, seed + 3);
      col = col.map((v) => Math.max(0, Math.min(255, Math.round(v * sh))));
      g.fillStyle = css(col);
      for (const xx of x0 + tw > S + 1e-6 ? [x0, x0 - S] : [x0]) g.fillRect(xx * k + mPx / 2, y0 * k + mPx / 2, tw * k - mPx, th * k - mPx);
    }
  }
  if (wear) {   // worn glaze: irregular beige patches snapped to a fine grid (like wear_snap in the Blender shader)
    const W = hexRGB(wear), cell = 0.05, n = Math.round(S / cell);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const v = fbmP((i / n) * wearF, (j / n) * wearF, wearF, seed + 11);
      if (v > wearT) {
        g.fillStyle = css(mixRGB(W, A, Math.max(0, 0.12 - (v - wearT)) * 2 * rng()));
        g.fillRect(i * cell * k, j * cell * k, cell * k + 0.6, cell * k + 0.6);
      }
    }
  }
  return cv;
}
function stripeCanvas(hex) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 4;
  const g = cv.getContext('2d');
  g.fillStyle = '#f6f3ec'; g.fillRect(0, 0, 128, 4);
  g.fillStyle = hex; g.fillRect(0, 0, 32, 4); g.fillRect(64, 0, 32, 4);
  return cv;
}
function streakCanvas() {   // anime glass: pale sky tint with two diagonal glints
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#b9d3e1'); gr.addColorStop(1, '#7f9fb6');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  g.globalAlpha = 0.55; g.fillStyle = '#f4fbff';
  for (const [x, w] of [[40, 34], [110, 12], [190, 22]]) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + w, 0); g.lineTo(x + w - 120, 256); g.lineTo(x - 120, 256); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(x + 256, 0); g.lineTo(x + w + 256, 0); g.lineTo(x + w + 136, 256); g.lineTo(x + 136, 256); g.closePath(); g.fill();
  }
  return cv;
}

const GLASS_TINTS = [['#24323b', 30], ['#2c3a45', 24], ['#1e282e', 14], ['#d8cdbb', 9], ['#d9b0aa', 6], ['#a9c0cc', 7], ['#16181b', 6], ['#c9d6c6', 4]];
const FRAME_TINTS = [['#e3893a', 3], ['#3b78bf', 3], ['#c94a3e', 2], ['#3f8f62', 2], ['#f0eee8', 4], ['#8a5a3c', 2], ['#e9c04e', 1], ['#6fb3c9', 2]];

function buildWalkway(mb) {
  const end = STREET_END + 40;
  mb.poly([[PATH_X0, WALK_Y0, 0], [PATH_X1, WALK_Y0, 0], [PATH_X1, end, 0], [PATH_X0, end, 0]], 'tileBlue', WHITE, null, [0, 0, 1]);
  mb.poly([[PATH_X1, WALK_Y0, 0], [SHOP_X + 0.05, WALK_Y0, 0], [SHOP_X + 0.05, end, 0], [PATH_X1, end, 0]], 'tilePink', WHITE, null, [0, 0, 1]);
  mb.poly([[PATH_X1 - 0.02, WALK_Y0, 0.002], [PATH_X1 + 0.02, WALK_Y0, 0.002], [PATH_X1 + 0.02, end, 0.002], [PATH_X1 - 0.02, end, 0.002]], 'paint', C('#eef0ee'), null, [0, 0, 1]);
  mb.box(PARA_X0, SHOP_X, WALK_Y0, end, -0.6, -0.001, 'stucco', C('#f1efe9'), { skip: 'z+' });
  mb.box(PARA_X0, PATH_X0, WALK_Y0, end, -0.6, 0.6, 'tileWhite', WHITE, { mtop: 'stucco', skip: 'z-' });
  mb.box(PARA_X0 - 0.05, PATH_X0 + 0.04, WALK_Y0, end, 0.6, 0.68, 'stucco', C('#f7f6f2'));
  for (let y = 9; y < Math.min(end, 400); y += 9) mb.box(PARA_X0 - 0.06, PATH_X0 + 0.02, y - 0.15, y + 0.15, -0.6, 1.08, 'paint', C('#4f98d0'), { skip: 'z-' });
}

function addSign(mb, s, xOut, yc, zb, sc, xWall) {
  const w = s.w * sc, h = s.h * sc, x1 = xOut, x0 = xOut - w, t = 0.09;
  if (s.kind === 'r') {
    const r = w / 2;
    mb.discY(x0 + r, yc - 0.025, zb + r, r, s.key, -1);
    mb.discY(x0 + r, yc + 0.025, zb + r, r, s.key, 1);
    mb.cyl(x0 + r, yc, zb + 2 * r - 0.02, zb + 2 * r + 0.25, 0.02, 0.02, 'metal', C('#8d9093'), 6, false);
  } else {
    mb.box(x0, x1, yc - t / 2, yc + t / 2, zb, zb + h, 'paint', C('#f2f1ec'), { skip: 'y-y+' });
    mb.quadY(yc - t / 2 - 0.002, x0, x1, zb, zb + h, s.key, WHITE, -1);
    mb.quadY(yc + t / 2 + 0.002, x0, x1, zb, zb + h, s.key, WHITE, 1);
  }
  const xw = xWall === undefined ? x1 + 0.09 : xWall + 0.03;
  for (const zz of [zb + h - 0.12, zb + 0.08]) mb.box(x1 - 0.02, xw, yc - 0.025, yc + 0.025, zz - 0.025, zz + 0.025, 'metal', C('#8d9093'));
}

function addAC(mb, xBack, yc, zb) {
  const w = 0.8, d = 0.3, h = 0.58, x0 = xBack - d, x1 = xBack - 0.01;
  mb.box(x0, x1, yc - w / 2, yc + w / 2, zb, zb + h, 'paint', C('#e4e4de'), { skip: 'x-' });
  mb.quadX(x0, yc - w / 2, yc + w / 2, zb, zb + h, 'ac');
  for (const yy of [yc - w / 2 + 0.06, yc + w / 2 - 0.1]) mb.box(x0 - 0.02, x1 + 0.01, yy, yy + 0.04, zb - 0.06, zb, 'metal', C('#9a9c9e'));
}

function addWindow(mb, rng, x, y0, y1, z0, z1, frames) {
  mb.quadX(x - 0.01, y0, y1, z0, z1, 'glass', C(rng.wpick(GLASS_TINTS)), -1, false);
  if (!frames) return;
  const fc = rng() < 0.8 ? C('#f3f2ee') : C('#b9c3c9'), t = 0.06, dp = 0.07;
  mb.box(x - dp, x, y0 - t, y1 + t, z0 - t, z0, 'paint', fc, { skip: 'x+' });
  mb.box(x - dp, x, y0 - t, y1 + t, z1, z1 + t, 'paint', fc, { skip: 'x+' });
  mb.box(x - dp, x, y0 - t, y0, z0, z1, 'paint', fc, { skip: 'x+z+z-' });
  mb.box(x - dp, x, y1, y1 + t, z0, z1, 'paint', fc, { skip: 'x+z+z-' });
  if (y1 - y0 > 1.2) { const ym = (y0 + y1) / 2; mb.box(x - dp * 0.8, x, ym - 0.03, ym + 0.03, z0, z1, 'paint', fc, { skip: 'x+z+z-' }); }
}

function addPlant(mb, rng, x, y, big) {
  let hh;
  if (rng() < 0.5) {
    const [r0, r1, h] = big ? [0.28, 0.36, 0.55] : [0.2, 0.26, 0.42];
    hh = h;
    mb.cyl(x, y, 0, hh, r0, r1, 'paint', C('#b5613f'), 14);
  } else {
    hh = 0.45;
    mb.box(x - 0.3, x + 0.3, y - 0.22, y + 0.22, 0, hh, 'paint', C(rng.pick(['#b5523b', '#c06a48', '#8a5a3c'])));
  }
  const n = big ? rng.int(8, 13) : rng.int(4, 8);
  for (let i = 0; i < n; i++) {
    const r = rng.uni(0.12, 0.24) * (big ? 1.4 : 1);
    const c = [x + rng.uni(-0.22, 0.22), y + rng.uni(-0.22, 0.22), hh + rng.uni(0.05, 0.45) * (big ? 2 : 1)];
    mb.blob(c, r, 'leaves', C(rng.pick(['#3f7b37', '#4a8a3e', '#356f34', '#58944a'])));
  }
  if (rng() < 0.55) {
    const fc = C(rng.pick(['#ef8fb0', '#f4b6c8', '#ffffff', '#e8576b']));
    for (let i = 0, m = rng.int(5, 12); i < m; i++) mb.blob([x + rng.uni(-0.25, 0.25), y + rng.uni(-0.25, 0.25), hh + rng.uni(0.2, 0.5)], rng.uni(0.035, 0.06), 'paint', fc, [1, 1, 1]);
  }
}

function buildBuilding(mb, rng, y0, y1, floors, style, detail) {
  const w = y1 - y0;
  const tint = C(rng.wpick(BUILDING_TINTS));
  const depth = rng.uni(11, 17);
  const H = GROUND_H + (floors - 1) * FLOOR_H;
  const xb = FACADE_X + depth;
  mb.box(FACADE_X, xb, y0, y1, GROUND_H, H, 'facade', tint, { mtop: 'stucco', skip: 'z-' });
  mb.box(SHOP_X, xb, y0, y1, -0.6, GROUND_H, 'facade', tint, { skip: 'z+' });
  for (const [ya, yb] of [[y0, y0 + 0.4], [y1 - 0.4, y1]]) mb.box(FACADE_X, SHOP_X, ya, yb, 0, GROUND_H, 'facade', tint, { skip: 'z+z-x+' });
  if (detail >= 1) {   // flat signs on the pilasters
    const vs = SIGNS.filter((s) => s.kind === 'v');
    for (const ya of [y0 + 0.02, y1 - 0.38]) {
      if (rng() < 0.6) {
        const s = rng.pick(vs), hh = 0.36 * s.h / s.w, zb = rng.uni(0.9, Math.max(0.95, GROUND_H - hh - 0.3));
        mb.quadX(FACADE_X - 0.006, ya, ya + 0.36, zb, zb + hh, s.key);
      }
    }
  }
  // ---- ground floor shopfront
  const frame = C(rng.wpick(FRAME_TINTS));
  const gy0 = y0 + 0.4, gy1 = y1 - 0.4;
  if (detail >= 1) {
    mb.quadX(SHOP_X - 0.005, gy0, gy1, 0.25, GROUND_H - 0.55, 'glass', C(rng.pick(['#5b564c', '#4e5c58', '#625a55', '#55626a'])), -1, false);
    mb.box(SHOP_X - 0.12, SHOP_X, gy0, gy1, 0, 0.25, 'paint', frame, { skip: 'x+' });
    mb.box(SHOP_X - 0.12, SHOP_X, gy0, gy1, GROUND_H - 0.55, GROUND_H - 0.47, 'paint', frame, { skip: 'x+' });
    const nm = Math.max(1, Math.floor((gy1 - gy0) / rng.uni(1.4, 2.3)));
    for (let k = 0; k <= nm; k++) { const ym = gy0 + (gy1 - gy0) * k / nm; mb.box(SHOP_X - 0.1, SHOP_X, ym - 0.04, ym + 0.04, 0.25, GROUND_H - 0.55, 'paint', frame, { skip: 'x+z+z-' }); }
    mb.box(SHOP_X - 0.16, SHOP_X, gy0, gy1, GROUND_H - 0.47, GROUND_H, 'paint', frame, { skip: 'x+' });
    const hs = SIGNS.filter((s) => s.kind === 'h'), s = rng.pick(hs), sh = 0.4;
    const sw = Math.min(s.w / s.h * sh, (gy1 - gy0) * 0.8);
    const yc = rng.uni(gy0 + sw / 2 + 0.1, Math.max(gy0 + sw / 2 + 0.1, gy1 - sw / 2 - 0.1));
    mb.quadX(SHOP_X - 0.165, yc - sw / 2, yc + sw / 2, GROUND_H - 0.44, GROUND_H - 0.44 + sh, s.key);
    if (detail >= 2) {
      if (rng() < 0.35) {   // drink vending machine
        const vy = rng.uni(gy0 + 0.6, gy1 - 1.4);
        const body = C(rng.pick(['#e9eef2', '#d84b3c', '#3b78bf', '#f1f0ea']));
        mb.box(3.75, 4.5, vy, vy + 0.95, 0, 1.85, 'paint', body);
        mb.quadX(3.745, vy + 0.08, vy + 0.87, 1.0, 1.75, 'glass', C('#cfd9de'), -1, false);
        mb.quadX(3.744, vy + 0.25, vy + 0.7, 1.08, 1.68, rng.pick(POSTERS));
      }
      for (let i = 0, n = rng.int(2, 5); i < n; i++) {
        const py = rng.uni(gy0 + 0.4, gy1 - 0.8), pz = rng.uni(0.8, 1.3);
        mb.quadX(SHOP_X - 0.012, py, py + 0.42, pz, pz + 0.59, rng.pick(POSTERS));
      }
      const pr = RNG(Math.floor(y0 * 1000) + 977);
      if (pr() < 0.5 && gy1 - gy0 > 1.8) {   // orange-framed wooden door
        const dy = pr.uni(gy0 + 0.15, gy1 - 1.25);
        mb.box(SHOP_X - 0.18, SHOP_X - 0.01, dy, dy + 1.1, 0, 2.6, 'paint', C('#e2802c'));
        mb.quadX(SHOP_X - 0.185, dy + 0.1, dy + 1.0, 0.1, 1.2, 'paint', C('#8a5a3c'), -1, false);
        mb.quadX(SHOP_X - 0.185, dy + 0.14, dy + 0.96, 1.32, 2.48, 'glass', C('#2c3236'), -1, false);
      }
      if (pr() < 0.35) {
        const vy = pr.uni(gy0 + 0.3, Math.max(gy0 + 0.31, gy1 - 1.2));
        if (pr() < 0.5) {
          const body = C(pr.pick(['#e9eef2', '#d84b3c', '#3b78bf']));
          mb.box(3.6, 4.5, vy, vy + 0.9, 0, 1.8, 'paint', body);
          mb.quadX(3.595, vy + 0.08, vy + 0.82, 0.95, 1.7, 'glass', C('#cfd9de'), -1, false);
          mb.quadX(3.59, vy + 0.22, vy + 0.68, 1.02, 1.62, pr.pick(POSTERS));
        } else {
          for (let i = 0, n = pr.int(2, 4); i < n; i++) {   // stacked crates
            const cx = pr.uni(3.7, 4.2), cy = vy + pr.uni(0, 0.7), z0 = i < 2 ? 0 : 0.4;
            mb.box(cx - 0.25, cx + 0.25, cy - 0.18, cy + 0.18, z0, z0 + 0.4, 'paint', C(pr.pick(['#c94a3e', '#3b78bf', '#e9c04e', '#b38a5a'])));
          }
        }
      }
    }
    if (rng() < 0.45) {   // striped awning
      const ai = rng.int(0, AWNING_TINTS.length - 1), key = 'aw' + ai;
      const zt = GROUND_H - 0.6, zl = GROUND_H - 1.25, xo = SHOP_X - 1.25, xs = SHOP_X - 0.17;
      const sl = [[xs, gy1, zt], [xs, gy0, zt], [xo, gy0, zl], [xo, gy1, zl]];
      const L = Math.hypot(xs - xo, zt - zl);
      const uv = [[gy1, 0], [gy0, 0], [gy0, L], [gy1, L]];
      mb.poly(sl, key, WHITE, uv);
      mb.poly(sl.slice().reverse(), key, WHITE, uv.slice().reverse());
      const vf = [[xo, gy0, zl - 0.25], [xo, gy1, zl - 0.25], [xo, gy1, zl], [xo, gy0, zl]];
      const vuv = [[gy0, 0], [gy1, 0], [gy1, 0.25], [gy0, 0.25]];
      mb.poly(vf, key, WHITE, vuv, [-1, 0, 0]);
      mb.poly(vf.slice().reverse(), key, WHITE, vuv.slice().reverse(), [1, 0, 0]);
    }
    if (detail >= 2) for (let i = 0, n = rng.int(0, 3); i < n; i++) addPlant(mb, rng, rng.uni(3.2, 4.2), rng.uni(gy0 + 0.4, gy1 - 0.4), rng() < 0.3);
  } else {
    mb.quadX(SHOP_X - 0.005, gy0, gy1, 0.25, GROUND_H - 0.5, 'glass', C('#2a2c2c'), -1, false);
    mb.box(SHOP_X - 0.16, SHOP_X, gy0, gy1, GROUND_H - 0.5, GROUND_H, 'paint', frame, { skip: 'x+' });
  }
  // ---- upper floors
  const balD = style === 'streamline' ? rng.uni(1.15, 1.55) : 0.95;
  const xFront = FACADE_X - balD;
  const nb = Math.max(1, Math.round((w - 0.8) / rng.uni(2.4, 3.2)));
  const bays = [];
  for (let k = 0; k < nb; k++) bays.push([y0 + 0.4 + (w - 0.8) * k / nb, y0 + 0.4 + (w - 0.8) * (k + 1) / nb]);
  const bayBalc = bays.map(() => rng() < 0.6);
  for (let f = 1; f < floors; f++) {
    const fz = GROUND_H + (f - 1) * FLOOR_H;
    if (style === 'streamline') {
      const R = Math.min(1.2, balD * 0.9);
      const O = rrect(xFront, FACADE_X + 0.2, y0 + 0.25, y1 - 0.25, R, 0);
      const I = rrect(xFront + 0.16, FACADE_X + 0.04, y0 + 0.41, y1 - 0.41, R - 0.16, 0);
      mb.prism(O, fz - 0.3, fz, 'stucco', tint, true, true);
      mb.ring(O, I, fz, fz + 1.1, 'stucco', tint);
    } else {
      mb.box(FACADE_X - 0.08, FACADE_X, y0, y1, fz - 0.18, fz, 'stucco', tint, { skip: 'x+' });
    }
    bays.forEach(([by0, by1], k) => {
      addWindow(mb, rng, FACADE_X, by0 + 0.3, by1 - 0.3, fz + 0.35, fz + 2.45, detail >= 1);
      if (style === 'bays' && bayBalc[k]) {
        const O = rrect(xFront, FACADE_X + 0.2, by0 + 0.15, by1 - 0.15, 0.28, 0);
        const I = rrect(xFront + 0.1, FACADE_X + 0.1, by0 + 0.25, by1 - 0.25, 0.18, 0);
        mb.prism(O, fz - 0.2, fz, 'stucco', tint, true, true);
        mb.ring(O, I, fz, fz + 1.0, 'stucco', tint);
      }
      if (rng() < (detail >= 1 ? 0.62 : 0.35)) {
        const yc = rng.uni(by0 + 0.5, by1 - 0.5);
        if (style === 'streamline' || bayBalc[k]) addAC(mb, xFront, yc, fz + 0.25);
        else if (f >= 2) addAC(mb, FACADE_X, yc, fz - 0.72);
      }
    });
  }
  // roof
  mb.box(FACADE_X - 0.05, xb, y0, y1, H, H + 0.55, 'stucco', tint, { skip: 'z-' });
  if (rng() < 0.6) mb.cyl(FACADE_X + rng.uni(2, depth - 3), rng.uni(y0 + 1.2, y1 - 1.2), H + 0.55, H + 2.0, 0.75, 0.75, 'paint', C(rng.pick(['#dfe8ec', '#f1efe8', '#c9dbe6'])));
  if (rng() < 0.5) { const ax = FACADE_X + rng.uni(1, 4), ay = rng.uni(y0 + 0.5, y1 - 0.5); mb.box(ax - 0.03, ax + 0.03, ay - 0.03, ay + 0.03, H + 0.55, H + rng.uni(2.5, 4.5), 'metal', C('#8d9093')); }
  // projecting signs towards the walkway
  const nSigns = detail === 2 ? rng.int(6, 10) : detail === 1 ? rng.int(3, 6) : rng.int(1, 3);
  const xOut = xFront - 0.07, used = [];
  for (let i = 0; i < nSigns; i++) {
    const s = rng.wpick(SIGNS.map((x) => [x, x.kind === 'v' ? 3 : 2]));
    const sc = rng.uni(0.95, 1.35), hh = s.h * sc;
    const zmax = Math.max(3.0, Math.min(H - hh - 0.3, 14.0));
    const zb = 2.7 + (zmax - 2.7) * Math.pow(rng(), 1.7);
    const yc = rng.uni(y0 + 0.6, y1 - 0.6);
    if (used.some((u) => Math.abs(yc - u) < 0.45)) continue;
    used.push(yc);
    addSign(mb, s, xOut, yc, zb, sc, style === 'streamline' ? xFront : FACADE_X);
  }
}

function buildStreet(mb) {
  const rng = RNG(7 * 101 + 3);
  let y = -8;
  while (y < STREET_END) {
    const w = rng.uni(8.5, 15.5);
    const detail = y < 60 ? 2 : y < 260 ? 1 : 0;
    const floors = y < 120 ? rng.int(6, 9) : rng.int(5, 12);
    const style = rng() < 0.58 ? 'streamline' : 'bays';
    buildBuilding(mb, rng, y, y + w, floors, style, detail);
    y += w + rng.pick([0, 0, 0, 0.7, 1.4]);
  }
}

function buildStairs(mb) {   // a staircase rising out of the cloud sea, leading nowhere
  const yL = 33.0, yR = 35.2, x0 = -5.5, z0 = -3.8, run = 0.31, rise = 0.31, N = 40;
  const white = C('#f6f4ef');
  for (let i = 0; i < N; i++) {
    const xa = x0 - (i + 1) * run, xb = x0 - i * run, zt = z0 + (i + 1) * rise;
    mb.box(xa, xb, yL, yR, zt - rise - 0.12, zt, 'stucco', white, { mtop: 'tileBlue', ctop: WHITE });
  }
  const rc = C('#f2f2ee'), posts = [];
  const idx = [];
  for (let i = 0; i < N; i += 4) idx.push(i);
  if (idx[idx.length - 1] !== N - 1) idx.push(N - 1);
  for (const i of idx) {
    const px = x0 - i * run - run / 2, pz = z0 + (i + 1) * rise;
    mb.box(px - 0.025, px + 0.025, yR - 0.06, yR - 0.01, pz, pz + 0.95, 'paint', rc);
    posts.push([px, yR - 0.035, pz + 0.95]);
  }
  mb.beam(posts[0], posts[posts.length - 1], 0.06, 0.05, 'paint', rc);
  const a = posts[0], b = posts[posts.length - 1];
  mb.beam([a[0], a[1], a[2] - 0.45], [b[0], b[1], b[2] - 0.45], 0.03, 0.03, 'paint', rc);
}

const ISLANDS = [[-215, 430, -7, 7], [-470, 980, -12, 9], [-140, 1400, -9, 6], [-900, 2200, -24, 10]];
function streamlineTower(mb, rng, cx, cy, zb, w, d, floors, tint) {
  const R = Math.min(w, d) * 0.28;
  for (let f = 0; f < floors; f++) {
    const z = zb + f * 3.0;
    mb.prism(rrect(cx - w / 2, cx + w / 2, cy - d / 2, cy + d / 2, R, R, 8), z, z + 1.4, 'stucco', tint, true, f === 0);
    mb.prism(rrect(cx - w / 2 + 0.35, cx + w / 2 - 0.35, cy - d / 2 + 0.35, cy + d / 2 - 0.35, R - 0.35, R - 0.35, 8), z + 1.4, z + 3.0, 'glass',
      C(rng.pick(['#8fa8bb', '#a7bccb', '#9db6c2', '#c9d6dc'])), false, false);
  }
  const top = zb + floors * 3.0;
  mb.prism(rrect(cx - w / 2, cx + w / 2, cy - d / 2, cy + d / 2, R, R, 8), top, top + 0.6, 'stucco', tint, true, false);
  if (rng() < 0.7) mb.cyl(cx + rng.uni(-w / 4, w / 4), cy + rng.uni(-d / 4, d / 4), top + 0.6, top + 2.6, 1.1, 1.1, 'paint', C('#dfe8ec'));
}
function buildIslands(mb) {
  const rng = RNG(7 * 7 + 11);
  for (const [cx, cy, cz, n] of ISLANDS) {
    for (let i = 0; i < n; i++) {
      const w = rng.uni(9, 20), d = rng.uni(9, 18);
      streamlineTower(mb, rng, cx + rng.uni(-28, 28), cy + rng.uni(-22, 22), cz - 3, w, d, rng.int(3, 13), C(rng.wpick(BUILDING_TINTS)));
    }
  }
}

// ------------------------------------------------------------------ clouds: cauliflower puffs (sphere piles + children)
const SQ = 0.8;
const HERO = [[-8.5, 15.0, -2.2, 4.8], [-12.0, 21.0, -1.6, 5.6], [-6.2, 9.5, -2.6, 3.3], [-15.5, 28.0, -2.4, 6.0], [-4.4, 6.0, -2.9, 2.6],
  [-6.0, 24.0, -3.2, 3.6], [-10.0, 34.0, -3.0, 4.6], [-19.0, 17.0, -1.0, 6.2], [-24.0, 25.0, -1.4, 7.0], [-3.6, 3.0, -2.9, 2.2]];

function genClouds() {
  const rng = RNG(1555);
  const pile = (x, y) => Math.min(2.4, 0.2 * Math.max(0, -x - 3)) + Math.min(0.8, 0.004 * Math.max(0, y - 40));

function buildWorld() {
  const mb = new Builder();
  buildWalkway(mb);
  buildStreet(mb);
  buildStairs(mb);
  buildIslands(mb);
  let tris = 0;
  for (const [key, o] of mb.B) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(o.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(o.n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(o.u, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(o.c, 3));
    g.setIndex(o.i);

    const mesh = new THREE.Mesh(g, m.std);
    mesh.castShadow = m.castShadow;

    solids.push(mesh);

const shotCam = new THREE.PerspectiveCamera(45, 1, 0.3, 12000);

const b2t = (x, y, z) => new THREE.Vector3(x, z, -y);
function shotPreset() {
  const portrait = window.innerWidth < window.innerHeight;

    shotCam.position.copy(pr.pos); shotCtl.target.copy(pr.target); shotCam.lookAt(pr.target);
  } else if (which === 'fly') {   // free roam starts (and resets) at the shot-1 position

  else if (e.key === '2') setStyle('pixel');
  else if (e.key === '3') setStyle('toon');
  else if (e.key === 'v' || e.key === 'V') setView(VIEWS[(VIEWS.indexOf(state.view) + 1) % VIEWS.length]);
});
window.addEventListener('keyup', (e) => { flyCtl.keys.delete(e.code); if (e.code === 'Space' && state.view === 'fly') e.preventDefault(); });
window.addEventListener('blur', () => flyCtl.keys.clear());
window.addEventListener('resize', () => {
  renderer.setPixelRatio(DPR());
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  setupTargets();
  placeJoy();
});

// ------------------------------------------------------------------ boot
let walked = 0, lastT = performance.now(), firstFrame = true;
const motionCheck = { skip: 40, n: 0, sum: 0, done: false };
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  if (state.walk) {
    const step = 1.6 * dt;
    for (const [cam, ctl] of [[shotCam, shotCtl], [isoCam, isoCtl]]) { cam.position.z -= step; ctl.target.z -= step; }
    walked += step;
    if (walked > 220) { for (const [cam, ctl] of [[shotCam, shotCtl], [isoCam, isoCtl]]) { cam.position.z += 220; ctl.target.z += 220; } walked -= 220; }
    needsRender = true;
  }
  if (state.motion) {   // breathing puffs, small floating clouds drifting back and forth over a few minutes
    CLOUD_U.uTime.value = t / 1000;
    if (floatMesh) { floatMesh.position.x = 55 * Math.sin(t / 1000 * 0.013); floatMesh.position.z = 25 * Math.sin(t / 1000 * 0.009 + 1.3); }
    needsRender = true;
    // a GPU that can't keep up (< ~22 fps) gets a still sky: frames are then only drawn when something changes
    if (!motionCheck.done && !firstFrame && document.visibilityState === 'visible' && motionCheck.skip-- <= 0) {
      motionCheck.n++; motionCheck.sum += dt;
      if (motionCheck.n >= 120) {
        motionCheck.done = true;
        if (motionCheck.sum / motionCheck.n > 0.045) { state.motion = false; syncUI(); }
      }
    }
  }
  if (renderFailed) return;
  if (state.view === 'fly') { if (flyCtl.update(dt)) needsRender = true; }
  else (state.view === 'iso' ? isoCtl : shotCtl).update();
  if (needsRender) {   // signs arriving later just trigger another frame; nothing waits for them
    needsRender = false;
    try {
      renderFrame();
    } catch (e) {
      renderFailed = true;
      fail('渲染出错：' + (e && e.message ? e.message : e));
      return;
    }
    if (firstFrame) { firstFrame = false; window.__booted = true; $('#status').hidden = true; }
  }
}
let renderFailed = false;

stage('正在搭建场景…');
setTimeout(() => {
  try {
    const t0 = performance.now();
    const info = buildWorld();
    window.__sceneInfo = { ...info, buildMs: Math.round(performance.now() - t0), gpu: GPU_NAME, lite: LITE };
    window.__cw = { THREE, scene, renderer, sun, hemi, sky, compMat, brightMat, CLOUD_MAT, CLOUD_U, BLOOM, MATS, state, shotCam, isoCam, flyCam, shotCtl, isoCtl, flyCtl, setStyle, setView, applyPreset, requestRender, syncUI, clouds };
    applyPreset('shot');
    applyPreset('iso');
    applyPreset('fly');
    setupTargets();
    syncUI();
    stage('正在渲染第一帧…');
    requestAnimationFrame(loop);
  } catch (e) {
    fail('场景搭建失败：' + (e && e.message ? e.message : e));
    throw e;
  }
}, 30);

</script>
